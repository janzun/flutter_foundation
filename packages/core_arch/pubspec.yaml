name: core_arch
description: "Core architecture package for MVVM/MVI, pure Dart base utilities, networking, responsive UI, and state management."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ">=2.4.4 <4.0.0"
  go_router: ">=14.2.0 <18.0.0"
  provider: ^6.1.2
  dio: ^5.8.0
  retrofit: ^4.4.2
  shared_preferences: ^2.3.4
  intl: ^0.20.2
  connectivity_plus: ^6.1.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.8
  retrofit_generator: ^9.1.9
