name: core_database
description: "High-performance NoSQL object database package based on Isar with zero-schema boilerplate and snapshot support."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  isar: 3.1.0+1
  isar_flutter_libs: 3.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  isar_generator: 3.1.0+1
